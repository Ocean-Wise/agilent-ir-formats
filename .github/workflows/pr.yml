name: Pull Request Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev)
        run: pip install -e ".[dev]"

      - name: Ruff check
        id: ruff
        run: ruff check src scripts tests

      - name: Pytest
        id: pytest
        run: pytest -q

      - name: Script --help smoke
        id: scripts
        run: |
          python scripts/batch_morphology_analysis.py --help
          python scripts/analyze_results.py --help
          agilent-batch-morphology --help

      - name: Summary
        if: ${{ always() }}
        env:
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          SCRIPTS_OUTCOME: ${{ steps.scripts.outcome }}
        shell: bash
        run: |
          emoji() {
            case "$1" in
              success) echo "✅ success" ;;
              failure) echo "❌ failure" ;;
              skipped) echo "⏭️ skipped" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }
          {
            echo "## PR checks (Python ${{ matrix.python-version }})"
            echo
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| Ruff | $(emoji "${RUFF_OUTCOME}") |"
            echo "| Pytest | $(emoji "${PYTEST_OUTCOME}") |"
            echo "| Script --help | $(emoji "${SCRIPTS_OUTCOME}") |"
          } >> "$GITHUB_STEP_SUMMARY"
